name: CI

on:
  push:
  workflow_dispatch:

# A newer push to the same ref makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Build the Electron main process
        run: npm run build:main

      - name: Build the renderer
        run: npm run build:renderer

      - name: Build the landing site
        run: npm run build:site
