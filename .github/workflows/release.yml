name: Release

# Two explicit ways in, one create-once behaviour:
#   - a v* tag whose name exactly matches package.json
#   - workflow_dispatch for a manifest version with no existing tag or release
#
# Windows only, Squirrel.Windows, and permanently unsigned. The notes say so.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate a unique version tag
        id: v
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $manifest = Get-Content package.json -Raw | ConvertFrom-Json
          $version = [string]$manifest.version
          if ([string]::IsNullOrWhiteSpace($version)) { throw "package.json has no version" }

          $expectedTag = "v$version"
          $artifactTemplate = [string]$manifest.build.squirrelWindows.artifactName
          if ([string]::IsNullOrWhiteSpace($artifactTemplate)) {
            throw "package.json has no build.squirrelWindows.artifactName"
          }
          $setupName = $artifactTemplate.Replace('${version}', $version).Replace('${ext}', 'exe')
          $requiredSetupName = "Sprout-Hollow-Valley-Setup-$version.exe"
          if ($setupName -ne $requiredSetupName) {
            throw "configured installer must resolve to $requiredSetupName, got $setupName"
          }

          $eventName = "${{ github.event_name }}"
          if ($eventName -eq "push") {
            if ("${{ github.ref_type }}" -ne "tag") {
              throw "release pushes must be tag events"
            }
            $tag = "${{ github.ref_name }}"
            if ($tag -ne $expectedTag) {
              throw "tag $tag does not match package.json version $version; expected $expectedTag"
            }
            $source = "tag"
          } elseif ($eventName -eq "workflow_dispatch") {
            $tag = $expectedTag
            $source = "dispatch"
          } else {
            throw "unsupported release event $eventName"
          }

          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:GITHUB_SHA) {
            throw "checked-out commit $head does not match GITHUB_SHA $env:GITHUB_SHA"
          }

          function Get-GitHubResourceStatus {
            param([string]$Path, [string]$Description, [int]$Tries = 5)
            $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
            }
            $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/$Path"
            for ($i = 1; $i -le $Tries; $i++) {
              try {
                $response = Invoke-WebRequest -Uri $uri -Headers $headers -Method Get -SkipHttpErrorCheck
                $status = [int]$response.StatusCode
                if ($status -in @(200, 404)) { return $status }
                $failure = "HTTP $status"
              } catch {
                $failure = $_.Exception.Message
              }
              if ($i -eq $Tries) {
                throw "could not establish whether $Description exists: $failure"
              }
              $wait = [Math]::Min(60, [Math]::Pow(2, $i) * 5)
              "Reading $Description failed ($failure). Retrying in $wait seconds."
              Start-Sleep -Seconds $wait
            }
          }

          $encodedTag = [Uri]::EscapeDataString($tag)
          $tagStatus = Get-GitHubResourceStatus "git/ref/tags/$encodedTag" "tag $tag"
          $releaseStatus = Get-GitHubResourceStatus "releases/tags/$encodedTag" "release $tag"
          if ($releaseStatus -ne 404) {
            throw "release $tag already exists; releases are immutable and will not be edited"
          }

          if ($source -eq "tag") {
            if ($tagStatus -ne 200) { throw "tag event $tag is not present on GitHub" }
            $tagCommit = (git rev-parse "refs/tags/$tag^{commit}").Trim()
            if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $env:GITHUB_SHA) {
              throw "tag $tag resolves to $tagCommit, not this run's commit $env:GITHUB_SHA"
            }
          } elseif ($tagStatus -ne 404) {
            throw "tag $tag already exists; workflow_dispatch only creates an unused version tag"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag"         >> $env:GITHUB_OUTPUT
          "setup=$setupName" >> $env:GITHUB_OUTPUT
          "source=$source"   >> $env:GITHUB_OUTPUT
          "Unique release slot $tag is available for $env:GITHUB_SHA ($source)."

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build the Squirrel.Windows package
        run: npm run package
        env:
          # Code signing is permanently prohibited for this project. Stop
          # electron-builder discovering a certificate and using it.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # electron-builder writes the setup executable, RELEASES and the .nupkg files
      # under dist/squirrel-windows/, NOT the dist/ root. A collector that looks at
      # the root reports a missing setup even though packaging succeeded.
      - name: Collect the artifacts
        id: collect
        shell: pwsh
        run: |
          # electron-builder writes Squirrel output to <directories.output>/squirrel-windows.
          # This project sets that to "release", not the default "dist", so read it from the
          # manifest rather than hardcoding a path that is right for somebody else's repo.
          $outDir = (Get-Content package.json -Raw | ConvertFrom-Json).build.directories.output
          if (-not $outDir) { $outDir = "dist" }
          $src = Join-Path $outDir "squirrel-windows"

          if (-not (Test-Path $src)) {
            "Expected $src. What electron-builder actually produced:"
            Get-ChildItem $outDir -Recurse -File -ErrorAction SilentlyContinue |
              ForEach-Object { "  " + $_.FullName.Replace((Get-Location).Path + [IO.Path]::DirectorySeparatorChar, "") }
            throw "no $src directory - Squirrel packaging did not produce its output where expected"
          }

          New-Item -ItemType Directory -Force staging | Out-Null
          Copy-Item "$src/*" staging -Recurse -Force

          $files = Get-ChildItem staging -File
          if (-not $files) { throw "staging is empty" }
          "Collected $($files.Count) files:"
          $files | ForEach-Object { "  {0,-52} {1:N0} bytes" -f $_.Name, $_.Length }

          $expectedSetup = "${{ steps.v.outputs.setup }}"
          $setup = $files | Where-Object { $_.Name -eq $expectedSetup }
          if (-not $setup) { throw "expected installer $expectedSetup was not produced" }
          $unexpectedExecutables = $files | Where-Object {
            $_.Extension -eq ".exe" -and $_.Name -ne $expectedSetup
          }
          if ($unexpectedExecutables) {
            throw "unexpected setup executable(s): $($unexpectedExecutables.Name -join ', ')"
          }
          $nupkg = $files | Where-Object { $_.Extension -eq ".nupkg" }
          if (-not $nupkg) { throw "no .nupkg was produced - Squirrel update assets are required" }
          if (-not (Test-Path staging/RELEASES)) { throw "no RELEASES file - Squirrel update feed is incomplete" }
          if ($setup.Length -lt 40MB) {
            throw "the setup executable is implausibly small; this is not a real build"
          }

      # The release contract requires this assertion, not an assumption: every setup
      # executable must actually report NotSigned before anything is published.
      - name: Assert every executable is unsigned
        shell: pwsh
        run: |
          $bad = @()
          foreach ($exe in Get-ChildItem staging -Filter *.exe) {
            $status = (Get-AuthenticodeSignature $exe.FullName).Status
            "{0,-52} {1}" -f $exe.Name, $status
            if ($status -ne "NotSigned") { $bad += "$($exe.Name) reports $status" }
          }
          if ($bad) { throw "expected every artifact to be unsigned: $($bad -join '; ')" }

      - name: Hash the artifacts and count the lines
        id: notes
        shell: pwsh
        run: |
          $hashes = Get-ChildItem staging -File | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "| ``$($_.Name)`` | {0:N0} | ``$h`` |" -f $_.Length
          }
          $counts = (npm run count --silent) -join "`n"

          # The code name comes from the public dim-sum catalogue, fetched now. If
          # that catalogue cannot be read the script exits non-zero rather than
          # inventing a dish, and the release simply carries no code name.
          $dish = ""
          try {
            $dish = (npm run dish --silent) -join "`n"
            if ($LASTEXITCODE -ne 0) { $dish = "" }
          } catch { $dish = "" }
          if ($dish) { $dish = "## Code name`n`n$dish`n" }

          $body = @"
          Sprout Hollow ${{ steps.v.outputs.tag }} for Windows.

          Built by GitHub Actions from ``$env:GITHUB_SHA`` on this run.

          $dish

          ## Install

          Download and run ``${{ steps.v.outputs.setup }}``.

          **These artifacts are not code-signed.** Windows will show an unknown-publisher
          or SmartScreen warning the first time you run the installer. That warning is
          accurate: nothing here carries a signature and no authenticity or signature
          verification is claimed. Every build is produced in public from the source in
          this repository, and the hashes below are the ones this run generated. If you
          would rather not trust an unsigned binary, build it yourself with ``npm run package``.

          ## Update assets

          Squirrel.Windows: the ``RELEASES`` feed, the full ``.nupkg`` and any generated
          delta packages are attached alongside the installer.

          ## Artifacts

          | File | Bytes | SHA-256 |
          |---|---:|---|
          $($hashes -join "`n")

          ## Size of the tree at this commit

          Produced by ``npm run count`` over this exact commit, in this run.

          $counts
          "@

          $body | Set-Content release-notes.md -Encoding utf8
          "Wrote release-notes.md ($($body.Length) chars)"

      # Publication is deliberately create-only. A failed or repeated run never moves a
      # tag, edits an existing release, or overwrites an existing asset.
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.v.outputs.tag }}"
          $assets = @(Get-ChildItem staging -File | ForEach-Object { $_.FullName })
          if (-not $assets) { throw "no release assets were staged" }

          if ("${{ steps.v.outputs.source }}" -eq "tag") {
            gh release create $tag $assets --verify-tag `
              --title "Sprout Hollow $tag" --notes-file release-notes.md --latest
          } else {
            gh release create $tag $assets --target $env:GITHUB_SHA `
              --title "Sprout Hollow $tag" --notes-file release-notes.md --latest
          }
          if ($LASTEXITCODE -ne 0) {
            throw "create-only publication of $tag failed; no existing tag, release, notes, or assets were modified"
          }

      - name: Confirm the release is downloadable
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.v.outputs.tag }}"

          # Read-only, and retried for the same reason the publish step is: a 503 here
          # would fail a release that is already published and downloadable, which would
          # be a lie in the opposite direction.
          function Read-WithRetry {
            param([string]$What, [scriptblock]$Body, [int]$Tries = 5)
            for ($i = 1; $i -le $Tries; $i++) {
              $out = & $Body
              if ($LASTEXITCODE -eq 0) { return $out }
              if ($i -eq $Tries) { throw "$What failed after $Tries attempts (exit $LASTEXITCODE)" }
              $wait = [Math]::Min(60, [Math]::Pow(2, $i) * 5)
              "$What failed (exit $LASTEXITCODE). Retrying in $wait seconds."
              Start-Sleep -Seconds $wait
            }
          }

          $json = (Read-WithRetry "Reading release $tag" {
            gh release view $tag --json isDraft,assets,tagName,url
          }) | ConvertFrom-Json
          if ($json.isDraft) { throw "the release is still a draft" }
          if ($json.tagName -ne $tag) { throw "release reports tag $($json.tagName), expected $tag" }

          # Resolve through the commits API so both lightweight and annotated tags are
          # compared to the checked-out commit rather than to an annotated tag object.
          $encodedTag = [Uri]::EscapeDataString($tag)
          $tagged = Read-WithRetry "Reading tag $tag" {
            gh api "repos/$env:GITHUB_REPOSITORY/commits/$encodedTag" --jq .sha
          }
          if ($tagged -ne $env:GITHUB_SHA) {
            throw "tag $tag points at $tagged but this release was built from $env:GITHUB_SHA"
          }
          "Tag $tag correctly points at $tagged"
          $assets = @($json.assets)
          $names = $assets.name
          "Published assets: $($names -join ', ')"

          $expectedSetup = "${{ steps.v.outputs.setup }}"
          foreach ($required in @($expectedSetup, 'RELEASES')) {
            if ($required -notin $names) { throw "the published release is missing $required" }
          }
          if (-not ($names | Where-Object { $_ -like '*.nupkg' })) {
            throw "the published release is missing a Squirrel .nupkg"
          }
          foreach ($asset in $assets) {
            if ([long]$asset.size -le 0) { throw "release asset $($asset.name) is empty" }
            if ([string]::IsNullOrWhiteSpace([string]$asset.url)) {
              throw "release asset $($asset.name) has no download URL"
            }
            "Downloadable: {0,-52} {1:N0} bytes  {2}" -f $asset.name, $asset.size, $asset.url
          }
